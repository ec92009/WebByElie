name: Site checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Remotion_AG/package-lock.json
            Three_AG/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix Remotion_AG
          npm ci --prefix Three_AG
      - name: Run source checks and studio builds
        run: |
          npm test
          npm --prefix Remotion_AG run build
          npm --prefix Three_AG run build
          npm --prefix Three_AG run render:smoke
